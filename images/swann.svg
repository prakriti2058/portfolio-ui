    <path d="M-26 82C2 128 44 186 86 340" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="2 6" fill="none" stroke-linecap="round"/>
    <!-- hair swept behind the ear into a braid over the shoulder -->
    <path d="M18-40C40-30 46 0 46 30C46 44 44 52 42 58L30 60C34 40 32 14 20 0Z" fill="#1a252f"/>
    <path d="M36 44C40 50 42 56 42 62" stroke="#1a252f" stroke-width="20" stroke-linecap="round" fill="none"/>
