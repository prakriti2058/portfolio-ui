  <!-- name -->
  <text x="56" y="112" fill="#34495e" font-size="14" font-weight="800" letter-spacing="5">SWANN</text>
  <rect x="56" y="126" width="36" height="3" rx="1.5" fill="#34495e"/>
  <g fill="#2c3e50" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">
    <text x="56" y="186">South Asian</text>
    <text x="56" y="234">Women and</text>
    <text x="56" y="282">Allies Network</text>
  </g>
  <text x="58" y="320" fill="#4d5d6c" font-size="14">Community · Mentorship · Belonging</text>
