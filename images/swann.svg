    <rect x="-15" y="28" width="30" height="50" rx="12" fill="#7f8c8d"/>
    <ellipse rx="35" ry="43" fill="#7f8c8d"/>
    <path d="M-37 4C-44-44-14-58 2-58C28-58 44-40 37 4C34-20 18-36 0-36C-18-36-34-20-37 4Z" fill="#1a252f"/>
    <path d="M0-58V-36" stroke="#7f8c8d" stroke-width="2"/>
    <circle cy="-20" r="3" fill="#1a252f"/>
    <g fill="#ecf0f1">
      <circle cx="-35" cy="16" r="3"/><path d="M-41 20H-29L-35 31Z"/>
      <circle cx="35" cy="16" r="3"/><path d="M29 20H41L35 31Z"/>
