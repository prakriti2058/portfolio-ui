    <path d="M-20 74C-12 96 12 96 20 74" stroke="#ecf0f1" stroke-width="2" fill="none"/>
    <circle cy="95" r="4" fill="#ecf0f1"/>
    <circle cx="-35" cy="20" r="4" fill="#ecf0f1"/><circle cx="35" cy="20" r="4" fill="#ecf0f1"/>
  </g>

  <!-- back right: bun, collar -->
  <g transform="translate(728 186) scale(.92)">
    <circle cy="-60" r="24" fill="#34495e"/>
    <use href="#shoulders" fill="#5d6d7e"/>
    <path d="M-34 70L0 120L34 70Z" fill="#ecf0f1"/>
    <rect x="-15" y="28" width="30" height="50" rx="12" fill="#95a5a6"/>
    <path d="M-15 70L0 100L15 70Z" fill="#95a5a6"/>
    <ellipse rx="35" ry="43" fill="#95a5a6"/>
