<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5e8ea"/>
      <stop offset="1" stop-color="#aab4b8"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f8f9fa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f8f9fa" stop-opacity="0"/>
    </radialGradient>

    <!-- one bust, head centred at 0,0; colours come from the <use> -->
    <path id="shoulders" d="M-118 340V196C-118 112-74 70 0 70C74 70 118 112 118 196V340Z"/>
    <path id="fringe" d="M-37 4C-44-44-14-58 2-58C28-58 44-40 37 4C32-22 14-36-6-34C-18-30-30-18-37 4Z"/>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="640" cy="200" r="230" fill="url(#halo)"/>
  <g fill="none" stroke="#7f8c8d" stroke-width="1.5" opacity=".35">
    <path d="M-20 400C150 350 260 440 420 390S700 320 840 360"/>
    <path d="M-20 428C160 378 270 462 430 418S700 352 840 390"/>
  </g>

  <!-- back left: long hair, side part -->
  <g transform="translate(530 196) scale(.92)">
    <path d="M-44-4C-52 50-58 90-46 130H46C58 90 52 50 44-4Z" fill="#2c3e50"/>
    <use href="#shoulders" fill="#34495e"/>
    <rect x="-15" y="28" width="30" height="50" rx="12" fill="#95a5a6"/>
    <ellipse rx="35" ry="43" fill="#95a5a6"/>
