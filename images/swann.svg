      <path transform="translate(47.7 63.9) rotate(-57.1)" d="M0 -13.9C12.2 -10.4 9.8 6.9 0 12.7C-9.8 6.9 -12.2 -10.4 0 -13.9Z"/>
      <path transform="translate(43.6 76.7) rotate(22.1)" d="M0 -13.5C11.8 -10.1 9.4 6.8 0 12.4C-9.4 6.8 -11.8 -10.1 0 -13.5Z"/>
      <path transform="translate(53.5 85.4) rotate(-50.8)" d="M0 -13.1C11.2 -9.9 9.0 6.6 0 12.0C-9.0 6.6 -11.2 -9.9 0 -13.1Z"/>
      <path transform="translate(48.7 97.6) rotate(28.2)" d="M0 -12.8C10.8 -9.6 8.6 6.4 0 11.7C-8.6 6.4 -10.8 -9.6 0 -12.8Z"/>
      <path transform="translate(57.0 107.6) rotate(-44.8)" d="M0 -12.4C10.2 -9.3 8.2 6.2 0 11.4C-8.2 6.2 -10.2 -9.3 0 -12.4Z"/>
      <path transform="translate(51.7 119.4) rotate(34.2)" d="M0 -12.1C9.8 -9.0 7.8 6.0 0 11.1C-7.8 6.0 -9.8 -9.0 0 -12.1Z"/>
      <path transform="translate(58.2 130.6) rotate(-39.0)" d="M0 -11.7C9.2 -8.8 7.4 5.8 0 10.7C-7.4 5.8 -9.2 -8.8 0 -11.7Z"/>
      <path transform="translate(52.4 142.1) rotate(39.8)" d="M0 -11.3C8.8 -8.5 7.0 5.7 0 10.4C-7.0 5.7 -8.8 -8.5 0 -11.3Z"/>
      <path transform="translate(57.2 154.2) rotate(-33.6)" d="M0 -11.0C8.2 -8.2 6.6 5.5 0 10.1C-6.6 5.5 -8.2 -8.2 0 -11.0Z"/>
    </g>
